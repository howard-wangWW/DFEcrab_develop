<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFEcrab · MCP 服务管理</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e4e7ec;
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --green: #16a34a;
    --green-bg: #ecfdf3;
    --gray-bg: #f3f4f6;
    --red: #dc2626;
    --amber: #d97706;
    --amber-bg: #fffbeb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 24px;
  }
  .container { max-width: 980px; margin: 0 auto; }
  header { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 22px; font-weight: 700; }
  header p { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  button {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  button:hover { background: #f9fafb; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--primary-hover); }
  button.danger { color: var(--red); }
  button.small { padding: 4px 10px; font-size: 12px; }
  #registryBadge { margin-left: auto; font-size: 12px; color: var(--muted); background: var(--gray-bg); padding: 4px 10px; border-radius: 999px; }

  section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 20px; }
  section h2 { font-size: 16px; margin-bottom: 12px; }
  section h2 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }

  .card { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .card.disabled-global { opacity: .6; }
  .card .main { min-width: 220px; flex: 1; }
  .card .name { font-weight: 600; }
  .card .url { color: var(--muted); font-size: 12px; word-break: break-all; }

  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.on { background: var(--green-bg); color: var(--green); }
  .badge.off { background: var(--gray-bg); color: var(--muted); }

  .bind { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .bind label { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .bind select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: var(--card); cursor: pointer; }
  .bind select:focus { outline: 2px solid var(--primary); outline-offset: 1px; }

  .ping { font-size: 12px; white-space: nowrap; }
  .ping.alive { color: var(--green); }
  .ping.dead { color: var(--red); }
  .ping.unknown { color: var(--muted); }
  .tools { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .actions { display: flex; align-items: center; gap: 6px; }

  details { border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-bottom: 20px; background: var(--card); }
  details summary { cursor: pointer; font-size: 15px; font-weight: 600; user-select: none; }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .form label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; }
  .form input, .form select {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--card);
  }
  .form input:focus, .form select:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .form .full { grid-column: 1 / -1; }
  .form .actions { grid-column: 1 / -1; justify-content: flex-start; gap: 10px; }

  #statusMsg { font-size: 13px; min-height: 20px; }
  #statusMsg.ok { color: var(--green); }
  #statusMsg.err { color: var(--red); }
  #statusMsg.warn { color: var(--amber); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>MCP 服务管理</h1>
    <p>启用 + 绑定 = 该智能体可用此服务工具（MCP 为中心，单一事实源）。"未绑定" 表示任何智能体不可用，"全局" 表示所有智能体可用。</p>
  </header>

  <div class="toolbar">
    <button id="btnAdd" class="primary">新增服务</button>
    <button id="btnRefresh">刷新</button>
    <label style="font-size:12px;color:var(--muted);margin-left:auto">用户身份
      <input id="fUserId" type="text" placeholder="admin" value="admin" style="padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;width:120px">
    </label>
    <span id="registryBadge"></span>
  </div>

  <section id="secServers">
    <h2>MCP 服务 <small>启用 + 绑定 = 该智能体可用此服务的工具</small></h2>
    <div id="serverList"></div>
  </section>

  <details id="secAdd">
    <summary>新增 MCP 服务</summary>
    <div class="form">
      <label>服务名称（小写字母/数字/下划线/连字符，小写字母开头）
        <input type="text" id="fName" placeholder="如 demo">
      </label>
      <label>服务地址 URL
        <input type="text" id="fUrl" placeholder="http://127.0.0.1:8600/mcp">
      </label>
      <label>传输协议
        <select id="fTransport">
          <option value="streamable_http" selected>streamable_http</option>
          <option value="sse">sse</option>
        </select>
      </label>
      <label>绑定到智能体
        <select id="fBound"></select>
      </label>
      <label class="full">鉴权 Token（选填，自动转 Authorization: Bearer xxx）
        <input type="text" id="fToken" placeholder="Bearer ... 或留空">
      </label>
      <div class="actions">
        <button id="btnTest" class="small">测试连接</button>
        <button id="btnSave" class="primary">保存</button>
        <span id="statusMsg"></span>
      </div>
    </div>
  </details>
</div>

<script>
(function () {
  "use strict";

  const state = {
    agents: [],
    servers: [],
  };

  const $ = (id) => document.getElementById(id);

  async function api(method, url, body) {
    const opts = { method, headers: {} };
    const uid = $("fUserId").value.trim() || localStorage.getItem("mcp_admin_uid") || "admin";
    if (uid) opts.headers["x-user-id"] = uid;
    if (body !== undefined) {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    const resp = await fetch(url, opts);
    let data = null;
    try { data = await resp.json(); } catch (e) { data = null; }
    if (!resp.ok) {
      throw new Error((data && data.error) ? data.error : ("HTTP " + resp.status));
    }
    if (data && data.success === false) {
      throw new Error(data.error || "请求失败");
    }
    return data;
  }

  function toast(msg, kind) {
    const el = $("statusMsg");
    el.textContent = msg;
    el.className = kind || "";
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.textContent = ""; el.className = ""; }, 3000);
  }

  function agentOptions() {
    let html = '<option value="">未绑定（不使用）</option>';
    html += '<option value="*">全局（所有智能体）</option>';
    state.agents.forEach((a) => {
      html += '<option value="' + a.agent_id + '">' + (a.name ? a.name + " (" + a.agent_id + ")" : a.agent_id) + "</option>";
    });
    return html;
  }

  function boundValueToOptionValue(boundAgents) {
    // bound_agents 可能是 ["*"] / ["agent"] / []；下拉为单选，取首个
    const arr = Array.isArray(boundAgents) ? boundAgents : (boundAgents === "*" ? ["*"] : []);
    if (!arr.length) return "";
    return arr.includes("*") ? "*" : arr[0];
  }

  function renderServers() {
    const list = $("serverList");
    list.innerHTML = "";
    if (!state.servers.length) {
      list.innerHTML = '<div style="color:var(--muted);font-size:13px">未发现 MCP 服务</div>';
      return;
    }
    state.servers.forEach((srv) => {
      const globallyOn = !!srv.enabled;
      const card = document.createElement("div");
      card.className = "card" + (globallyOn ? "" : " disabled-global");

      const main = document.createElement("div");
      main.className = "main";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = srv.name;
      const url = document.createElement("div");
      url.className = "url";
      url.textContent = srv.url || "(未配置 URL)";
      main.appendChild(name);
      main.appendChild(url);

      const badge = document.createElement("span");
      badge.className = "badge " + (globallyOn ? "on" : "off");
      badge.textContent = globallyOn ? "已启用" : "已停用";

      // 绑定下拉（单一事实源）
      const bind = document.createElement("div");
      bind.className = "bind";
      const lbl = document.createElement("label");
      lbl.textContent = "绑定";
      const sel = document.createElement("select");
      sel.innerHTML = agentOptions();
      sel.value = boundValueToOptionValue(srv.bound_agents);
      sel.addEventListener("change", () => setBinding(srv.name, sel.value));
      bind.appendChild(lbl);
      bind.appendChild(sel);

      const tools = document.createElement("span");
      tools.className = "tools";
      tools.textContent = (srv.tool_count || 0) + " 个工具";

      const ping = document.createElement("span");
      ping.className = "ping unknown";
      if (srv.alive === true) {
        ping.className = "ping alive";
        ping.textContent = "alive" + (srv.latency_ms != null ? (" · " + srv.latency_ms + "ms") : "");
      } else if (srv.alive === false) {
        ping.className = "ping dead";
        ping.textContent = "不通";
      } else {
        ping.textContent = "—";
      }

      const acts = document.createElement("div");
      acts.className = "actions";
      const btnToggle = document.createElement("button");
      btnToggle.className = "small";
      btnToggle.textContent = globallyOn ? "停用" : "启用";
      btnToggle.addEventListener("click", () => toggleServer(srv.name, !globallyOn, btnToggle));
      const btnSync = document.createElement("button");
      btnSync.className = "small";
      btnSync.textContent = "同步";
      btnSync.addEventListener("click", () => syncServer(srv.name, btnSync));
      const btnDel = document.createElement("button");
      btnDel.className = "small danger";
      btnDel.textContent = "删除";
      btnDel.addEventListener("click", () => deleteServer(srv.name, btnDel));
      acts.appendChild(btnToggle);
      acts.appendChild(btnSync);
      acts.appendChild(btnDel);

      card.appendChild(main);
      card.appendChild(badge);
      card.appendChild(bind);
      card.appendChild(tools);
      card.appendChild(ping);
      card.appendChild(acts);
      list.appendChild(card);
    });
  }

  async function setBinding(name, value) {
    try {
      const bound = value === "" ? [] : (value === "*" ? "*" : [value]);
      const resp = await api("POST", "/api/mcp/servers/" + encodeURIComponent(name) + "/binding", { bound_agents: bound });
      toast("已更新绑定: " + name, "ok");
      await refresh(false);
    } catch (e) {
      toast("更新绑定失败: " + e.message, "err");
      await refresh(false);
    }
  }

  async function toggleServer(name, enable, btn) {
    btn.disabled = true;
    try {
      const resp = await api("POST", "/api/mcp/servers/" + encodeURIComponent(name) + "/toggle", { enabled: enable });
      const d = resp.data || {};
      if (d.auto_disabled) toast("服务不健康，已被自动停用", "warn");
      else toast("已" + (d.enabled ? "启用" : "停用") + "服务 " + name, "ok");
      setRegistryBadge(d.registry);
      await refresh(true);
    } catch (e) {
      toast("启停失败: " + e.message, "err");
    } finally {
      btn.disabled = false;
    }
  }

  async function syncServer(name, btn) {
    btn.disabled = true;
    try {
      const resp = await api("POST", "/api/mcp/servers/" + encodeURIComponent(name) + "/sync", {});
      const d = resp.data || {};
      toast("已同步 " + (d.tool_count || 0) + " 个工具", "ok");
      setRegistryBadge(d.registry);
      await refresh(true);
    } catch (e) {
      toast("同步失败: " + e.message, "err");
    } finally {
      btn.disabled = false;
    }
  }

  async function deleteServer(name, btn) {
    if (!confirm("确认删除 MCP 服务 " + name + "？已绑定该服务的智能体将无法再调用其工具。")) return;
    btn.disabled = true;
    try {
      const resp = await api("DELETE", "/api/mcp/servers/" + encodeURIComponent(name));
      const d = resp.data || {};
      toast("已删除 " + name, "ok");
      if (d.registry) setRegistryBadge(d.registry);
      await refresh(false);
    } catch (e) {
      toast("删除失败: " + e.message, "err");
    } finally {
      btn.disabled = false;
    }
  }

  async function testConnection() {
    const url = $("fUrl").value.trim();
    if (!url) { toast("请先填写服务地址", "warn"); return; }
    $("btnTest").disabled = true;
    try {
      const resp = await api("POST", "/api/mcp/servers/test", {
        url: url,
        transport: $("fTransport").value,
      });
      const d = resp.data || {};
      if (d.alive) toast("连通成功 · " + (d.tool_count || 0) + " 个工具 · " + (d.latency_ms != null ? d.latency_ms + "ms" : ""), "ok");
      else toast("连接失败：" + (d.error || "未知错误"), "err");
    } catch (e) {
      toast("测试失败: " + e.message, "err");
    } finally {
      $("btnTest").disabled = false;
    }
  }

  async function addServer() {
    const name = $("fName").value.trim();
    const url = $("fUrl").value.trim();
    if (!name || !url) { toast("名称和 URL 为必填", "warn"); return; }
    const token = $("fToken").value.trim();
    const boundVal = $("fBound").value;
    const body = {
      name: name,
      url: url,
      transport: $("fTransport").value,
      bound_agents: boundVal === "" ? [] : (boundVal === "*" ? "*" : [boundVal]),
      auto_sync: true,
    };
    if (token) body.headers = { Authorization: "Bearer " + token };
    $("btnSave").disabled = true;
    try {
      const resp = await api("POST", "/api/mcp/servers", body);
      const d = resp.data || {};
      toast("已新增服务 " + name + (d.sync_error ? "（但同步失败: " + d.sync_error + "）" : ""), d.sync_error ? "warn" : "ok");
      $("fName").value = "";
      $("fUrl").value = "";
      $("fToken").value = "";
      await refresh(false);
    } catch (e) {
      toast("新增失败: " + e.message, "err");
    } finally {
      $("btnSave").disabled = false;
    }
  }

  function setRegistryBadge(registry) {
    if (registry) {
      $("registryBadge").textContent = "本地 " + registry.local_tools + " 工具 / MCP " + registry.mcp_tools + " 工具";
    }
  }

  async function refresh(withCheck) {
    try {
      const srvResp = await api("GET", "/api/mcp/servers" + (withCheck ? "?check=true" : ""));
      state.servers = (srvResp.data && srvResp.data.servers) || [];
      renderServers();
    } catch (e) {
      toast("刷新失败: " + e.message, "err");
    }
  }

  async function init() {
    try {
      const savedUid = localStorage.getItem("mcp_admin_uid");
      if (savedUid) $("fUserId").value = savedUid;
      $("fUserId").addEventListener("change", () => {
        localStorage.setItem("mcp_admin_uid", $("fUserId").value.trim());
      });
      const [agentsResp, srvResp] = await Promise.all([
        api("GET", "/api/agents"),
        api("GET", "/api/mcp/servers?check=true"),
      ]);
      state.agents = (agentsResp && (agentsResp.agents || (agentsResp.data && agentsResp.data.agents))) || [];
      state.servers = (srvResp.data && srvResp.data.servers) || [];
      $("fBound").innerHTML = agentOptions();
      renderServers();
      $("registryBadge").textContent = "MCP 服务 " + state.servers.length + " 个";
    } catch (e) {
      toast("初始化失败: " + e.message, "err");
    }
  }

  $("btnRefresh").addEventListener("click", () => refresh(true));
  $("btnTest").addEventListener("click", testConnection);
  $("btnSave").addEventListener("click", addServer);
  $("btnAdd").addEventListener("click", () => { $("secAdd").open = !$("secAdd").open; });

  init();
})();
</script>
</body>
</html>
